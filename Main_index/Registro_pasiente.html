<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New User</title>
    <link rel="stylesheet" href="../Main_styles/style_pasiente.css">
    <link rel="icon" href="../Main_icons/health_icon.png">
    <link rel="stylesheet" href="../Main_font/font.css">
</head>
<body>

    <!-- HEADER  -->
    <header class="top-nav">
        <h2>HEALTH PLUS</h2>
    </header>

    <div class="page-wrapper">
        <main class="registration-section">
            <div class="form-card">
                <h1 class="form-title">Create a New Account</h1>
                <p class="form-subtitle">Register to access the appointment menu and control panel.</p>
                
                <form id="registration-form">
                    
                    
                    <div class="form-group">
                        <label for="fullName">Address</label>
                        <div class="input-with-icon">
                            <input type="text" id="fullAddres" class="form-input" placeholder="First and Last Name" required>
                    
                        </div>
                    </div>

                    
                    <div class="form-group">
                        <label for="email">Height</label>
                        <div class="input-with-icon">
                            <input type="text" id="email" class="form-input" placeholder="example@email.com" required>
                          
                        </div>
                    </div>

                
                    <div class="form-group">
                        <label for="password">Weight</label>
                        <div class="input-with-icon">
                            <input type="" id="password" class="form-input" placeholder="Minimum 8 characters" required minlength="8">
                           
                        </div>
                    </div>


                    <button type="submit" class="register-btn">
                        Register
                    </button>
                </form>

                <p class="login-link">
                    Already have an account? <a href="../Main_index/index.html">Log In</a>
                </p>
            </div>
        </main>
    </div>

    <!--FOOTER -->
   <footer class="main-footer">
            <div class="footer-container">
                <div class="footer-section copyright-section">
                    <h4 class="footer-title">Health Plus</h4>
                    <p class="footer-text">© 2025 Health Plus. All rights reserved.</p>
                    <p class="footer-text">License No. 123456</p>
                </div>
                <div class="footer-section links-section">
                    <h4 class="footer-title">Quick Links</h4>
                    <a href="https://protecciondatos-lopd.com/empresas/politica-de-privacidad-web/" class="footer-link" target="_blank">Privacy Policy</a>
                    <a href="https://protecciondatos-lopd.com/empresas/terminos-y-condiciones-pagina-web/" class="footer-link" target="_blank">Terms of Service</a>
                </div>
                <div class="footer-section social-university-section">
                    <h4 class="footer-title">Connect</h4>
                    <div class="social-icons">
                        <a href="https://www.facebook.com/share/1DrHM8sj4V/" target="_blank"><img src="../Main_icons/facebook.png" alt="icon_facebook"></a>
                        <a href="https://www.tiktok.com/@utr.ags?_r=1&_t=ZS-91osnajKf69" target="_blank"><img src="../Main_icons/tiktok.png" alt="icon_tiktok"></a>

                    </div>
                    <a href="https://utr.edu.mx/" target="_blank" class="university-link">
                        <img src="../Main_icons/school.svg" alt="school_icon"> Official University Site
                    </a>
                </div>
            </div>
        </footer> 
    <script src="../Main_js/js_registro.js"></script>

</body>
